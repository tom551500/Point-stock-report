name: 台股關鍵分點 Telegram 通知（平日 20:17）

on:
  schedule:
    # GitHub Actions cron uses UTC: 12:17 UTC = 20:17 Asia/Taipei.
    - cron: "17 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 下載專案檔案
        uses: actions/checkout@v5

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安裝查詢需要的套件
        run: python -m pip install requests beautifulsoup4

      - name: 查詢關鍵分點並傳送 Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/branch_alert.py
